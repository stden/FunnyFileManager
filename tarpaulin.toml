# Purpose: Configures cargo-tarpaulin coverage collection for the project.
[coverage]
# Excluded from measurement (mirrors the CI llvm-cov regex — keep in sync):
# - main.rs / bootstrap.rs: the real-TTY entry points; they take over the
#   terminal and cannot run under a test harness
# - clipboard/system.rs: arboard/OS-clipboard glue — whether it works depends
#   on the machine (headless CI has no clipboard), not on this crate
# - ops/shell/tty.rs: drains crossterm's live event queue for cancel keys
# - test files (tests*.rs / *_tests.rs / tests/ / test_support.rs /
#   test_support/): tests are not code under test; their unreached lines are
#   assertion-failure arms
#
# editor.rs is deliberately NOT excluded: the $EDITOR resolution and the
# spawn path are covered by src/editor/tests/, and hiding the file only
# hid the fact that they were not.
exclude-files = [
    "*/main.rs",
    "*/bootstrap.rs",
    "*/clipboard/system.rs",
    "*/ops/shell/tty.rs",
    "*/highlight/colorer.rs",
    "*/tests.rs",
    "*/tests_*.rs",
    "*/*_tests.rs",
    "*/tests/*.rs",
    "*/tests/**/*.rs",
    "*/test_support.rs",
    "*/test_support/*",
    "*/test_support/**/*",
]
