# Purpose: Configures cargo-deny — which licences and sources are acceptable.
#
# Without this file cargo-deny's allow-list is empty, so it rejects every
# dependency including MIT and Apache-2.0. The check reported "licenses FAILED"
# on a tree with nothing wrong with it, which is the same as not running it.

[licenses]
# Permissive licences only. Anything copyleft in a dependency of a shipped
# binary is a decision, not a default, so it has to be added here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions of the same crate are noise in this tree — the AWS SDK and
# ratatui each pull their own — so they are a warning rather than a failure.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# Every advisory cargo-deny reports is an error; there is no warning level for
# advisories. The two keys below are cargo-deny's own defaults, written out so
# this file says what the check does: an `unmaintained` advisory fails for any
# crate in the graph, an `unsound` one only when this crate depends on the
# unsound crate directly (a transitive one is dropped, not reported).
# A finding is fixed by a dependency update, never by adding it to `ignore`.
unmaintained = "all"
unsound = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
