min_version = "2026.10.12"

[settings]
# Read the Rust version and components from rust-toolchain.toml.
idiomatic_version_file_enable_tools = ["rust"]

[tools]
python = "3.13"
rtk = "0.49.0"

[tasks.build]
description = "Build the release binary"
run = "rtk proxy python ffm.py build release"

[tasks.check]
description = "Check all root package targets"
run = "rtk cargo check --all-targets"

[tasks.test]
description = "Run the existing feature and BDD test suites"
run = "rtk proxy python ffm.py test"

[tasks.lint]
description = "Run the full lint and coverage gate"
run = "rtk proxy python ffm.py lint"

[tasks.fmt]
description = "Format all Rust packages"
run = [
  "rtk cargo fmt --all",
  "rtk cargo fmt --all --manifest-path mcp/Cargo.toml",
  "rtk cargo fmt --all --manifest-path colorer-sys/Cargo.toml",
]

[tasks."fmt:check"]
description = "Check the format of all Rust packages"
run = "rtk proxy python ffm.py lint fmt"

[tasks.coverage]
description = "Run the full Rust and Python coverage gate"
run = "rtk proxy python ffm.py coverage"

[tasks.ci]
description = "Run lint and tests in order"
run = [{ task = "lint" }, { task = "test" }]
