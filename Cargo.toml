# Purpose: Defines the main FunnyFileManager crate, features, dependencies, and targets.
[package]
name = "funny-file-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Terminal dual-panel file manager inspired by Far Manager, with AWS S3 integration"
license = "MIT"
keywords = ["file-manager", "tui", "terminal", "far-manager", "s3"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "funny_file_manager"
path = "src/lib.rs"
# The crate has no runnable doctests (the one fence in lib.rs is a text block
# rustdoc never executes), but the doc-test phase still spawns a rustdoc
# binary. A linked custom toolchain can ship without rustdoc, and then
# `cargo test` aborts on the empty phase. Skip the phase instead.
doctest = false

[[bin]]
name = "ffm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["serde"] }
tempfile = "3.27.0"
# Terminal *cell* widths. ratatui budgets each buffer row in cells, so the UI
# must measure the same way: a CJK glyph is one char but two columns.
unicode-width = "0.2.2"
encoding_rs = "0.8.41"

# Local date/time for the panel's Date and Time columns. `SystemTime` counts
# seconds since the epoch and std has no calendar, let alone a timezone: the
# columns show *local* wall-clock time, which needs the IANA database the
# `clock` feature reaches. default-features = false drops the `oldtime`,
# `serde` and wasm bindings this never touches.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# See the `colorer` feature.
colorer-sys = { path = "colorer-sys", version = "0.1", optional = true }

# AWS S3 integration (optional — enable with --features s3)
aws-config = { version = "1.12.0", optional = true }
# default-features = false drops the SDK's legacy `rustls` feature, which pins
# rustls 0.21 / rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). The modern
# TLS path (`default-https-client` -> rustls 0.23 + aws-lc, webpki 0.103) is
# what actually serves requests; the remaining features mirror the defaults.
aws-sdk-s3 = { version = "1.148.0", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
], optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }

# NetBox stored sessions: the `.netbox` import is WinSCP's XML. A DOM over a
# small, size-bounded file is simpler than a streaming parser; its default
# options refuse a DTD, so no entity is ever expanded or fetched.
roxmltree = "0.21.1"

# KeePass .kdbx read/edit (optional — enable with --features keepass).
# default-features = false drops CLI extras; save_kdbx4 unlocks Database::save.
# NOTE: keepass >= 0.13 declares rust-version 1.85, below the crate's 1.95 floor.
# The write path is upstream-experimental, so the module backs up + writes
# atomically (see src/keepass.rs).
keepass = { version = "0.15.0", default-features = false, features = ["save_kdbx4"], optional = true }
# Serialization for portable recordings, the settings file (YAML, with the
# JSON file older builds wrote read once for migration) and kdbx JSON/YAML
# export. serde_norway is a maintained serde_yaml fork; serde_yaml itself is
# archived.
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps a rewritten MCP client config (F9 Commands > Install
# MCP server) in the key order its owner wrote. Without it the shipped binary
# would sort a user's `.mcp.json`, while tests keep order through a
# dev-dependency's copy of the feature and never see the difference.
# `raw_value` lets that rewrite carry every value but the ffm-mcp entry as
# the exact text it was read in: a `Value` round trip turns `1e3` into
# `1000.0` and rounds a 24-digit integer.
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
# The ordered map those raw values are read into (already in the tree through
# serde_json and toml_edit; `serde` reads a JSON object straight into it).
indexmap = { version = "2.14.2", features = ["serde"] }
serde_norway = "0.9.42"
# Names the setting a load rejects (`system.history_size: invalid type …`):
# the settings are read from a parsed YAML value, which carries no line numbers.
serde_path_to_error = "0.1.20"
# Codex keeps its MCP servers in TOML (`config.toml`). The installer reads its
# status at both scopes and edits the file in place, keeping the comments and
# layout the user wrote: a hand-rolled scan would break on inline tables and
# dotted keys. Only the parser and the writer; no serde.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# File URI encoding/decoding, including Windows drive and UNC paths.
url = "2.5.8"
# Text clipboard for editor selection and optional vault password copying.
# Image support is unused; disabling it avoids image codec build dependencies.
arboard = { version = "3.6.1", default-features = false }
sha2 = "0.11"
flate2 = "1.1"
tar = "0.4"

[dev-dependencies]
regex = "1"
criterion = "0.8.2"
cucumber = "0.23.0"
futures = "0.3.34"
# S3 test mocks (used only by `#[cfg(feature = "s3")]` tests in src/s3/tests*.rs).
# Versions track the aws-sdk-s3 1.x smithy stack already in the lockfile.
aws-smithy-http-client = { version = "1.4.2", features = ["test-util"] }
aws-smithy-types = "1.8.0"
http_1x = { package = "http", version = "1.5.0" }
# Architecture tests parse sources instead of matching text: tests/architecture/
# (module boundaries) and tests/unsafe_boundary_test.rs (the unsafe allowlist).
# proc-macro2 is already in the lockfile through proc-macro dependencies; syn 3
# is a second copy beside their syn 2, used by these tests only.
# `span-locations` gives the violations their line numbers.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.6", features = ["full", "visit"] }

[features]
# Colorer is how the editor prefers to highlight, so it is on. The build script
# never fails when the library is absent: the crate compiles to stubs and the
# built-in tokenizer does the work. See docs/colorer.md.
default = ["colorer", "keepass"]
test-helpers = []
# Real Colorer highlighting: the C++ engine Far's FarColorer plugin uses, with
# Far's own HRC schemes. On by default, and harmless when the library is absent:
# colorer-sys compiles to stubs and the built-in tokenizer does the work, so
# `cargo build` never needs ICU, libxml2 or zlib. Install the engine itself with
# `./ffm.py colorer` or `ffm.cmd colorer`.
colorer = ["dep:colorer-sys"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]
keepass = ["dep:keepass"]

# Drives the real event loop, so it needs the writable test backend.
[[test]]
name = "e2e_test"
path = "tests/e2e_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "highlight_render_test"
path = "tests/highlight_render_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "editor_test"
path = "tests/editor_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "editor_workflow_test"
path = "tests/editor_workflow_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "wsl_workflow_test"
path = "tests/wsl_workflow_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "handlers_test"
path = "tests/handlers_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "navigation_features_test"
path = "tests/navigation_features_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "coverage_100_test"
path = "tests/coverage_100_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "far_manager_hotkeys_test"
path = "tests/far_manager_hotkeys_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "comprehensive_test"
path = "tests/comprehensive_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "extra_coverage_test"
path = "tests/extra_coverage_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "targeted_coverage_tests"
path = "tests/targeted_coverage_tests.rs"
required-features = ["test-helpers"]

[[test]]
name = "coverage_gaps_test"
path = "tests/coverage_gaps_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
required-features = ["test-helpers", "s3"]

[[test]]
name = "tui_bdd"
path = "tests/tui_bdd.rs"
required-features = ["test-helpers", "keepass"]

[[test]]
name = "coverage_boost_test"
path = "tests/coverage_boost_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "bdd_ru"
path = "tests/bdd_ru.rs"
harness = false
required-features = ["test-helpers", "s3"]

[[test]]
name = "mutation_killer_tests"
path = "tests/mutation_killer_tests.rs"
required-features = ["test-helpers"]

[[bench]]
name = "utils_bench"
harness = false

[[bench]]
name = "ui_bench"
harness = false

[[bench]]
name = "ops_bench"
harness = false

[[bench]]
name = "autocomplete_bench"
harness = false

[[bench]]
name = "editor_cursor_bench"
harness = false

[[bench]]
name = "editor_languages"
harness = false

[[bench]]
name = "content_search"
harness = false

[[bench]]
name = "panel_bench"
harness = false

# Needs a real vault to open, so it only builds where the vault does.
[[bench]]
name = "kdbx_bench"
harness = false
required-features = ["keepass"]

# Local builds prioritize compilation speed. Matching dev/test settings lets
# Cargo reuse dependency artifacts between building, checking and testing.
# Production optimization remains explicit via --release.

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
strip = "debuginfo"
debug = 0
incremental = true
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
# Keep these settings aligned with dev for dependency artifact reuse.
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256
lto = false
debug-assertions = true
overflow-checks = true

[profile.test.package."*"]
opt-level = 2

# ── Release: maximum runtime speed ───────────────────────────────
# Fat LTO + single codegen unit give the compiler full cross-crate
# inlining at the cost of a longer link step. panic=abort removes
# unwinding machinery; strip=symbols shrinks the binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false
overflow-checks = false

# Inherits everything from release but links faster — use for iterating
# on release-only behavior without paying full LTO cost every build.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[lints.rust]
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)", "cfg(coverage)"] }
# Unsafe code lives only in reviewed platform/FFI boundaries: each one opts in
# with an item-level `#[allow(unsafe_code, reason = "...")]`, and
# tests/unsafe_boundary_test.rs keeps those items on an explicit file allowlist.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
# Reliability guards nothing trips today, kept so it stays that way: unused or
# single-use lifetimes, macro and import noise, a numeric cast to its own type,
# a binding of `()`, identifiers that are 2024 keywords or not ASCII, and an
# unsafe attribute (`no_mangle`, `export_name`) not spelled `#[unsafe(...)]`.
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
redundant_lifetimes = "warn"
explicit_outlives_requirements = "warn"
unused_macro_rules = "warn"
meta_variable_misuse = "warn"
unused_import_braces = "warn"
unused_extern_crates = "warn"
macro_use_extern_crate = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
keyword_idents_2024 = "warn"
non_ascii_idents = "warn"
unsafe_attr_outside_unsafe = "warn"
# Code that hides what it does: a destructor run by `let _ =`, a cast a coercion
# would do, a `pub` type nobody outside can name, a path or import that says
# nothing, a lifetime hidden in a path (`Formatter<'_>`, not `Formatter`).
let_underscore_drop = "warn"
trivial_casts = "warn"
unnameable_types = "warn"
unused_qualifications = "warn"
redundant_imports = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Every unsafe block states why it is sound in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"
# Production code never panics or exits: it returns the error, or proves the
# invariant in an `#[expect(clippy::<lint>, reason = "...")]` on the smallest
# item. clippy.toml lets tests unwrap, expect, index, panic, print and dbg!.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
indexing_slicing = "warn"
string_slice = "warn"
as_conversions = "warn"
# An error is handled or passed on, never dropped without a word.
map_err_ignore = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
# The terminal belongs to the TUI: output goes through the UI or the log, and a
# user never reads a `{:?}`. Hash-map order and `FileType::is_file` (false for
# devices, pipes and sockets) are never relied on.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
use_debug = "warn"
iter_over_hash_type = "warn"
filetype_is_file = "warn"
# One unsafe operation per block, each with its own SAFETY comment; no SAFETY
# comment or `# Safety` doc where nothing is unsafe; every allow and expect
# attribute says why.
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
allow_attributes_without_reason = "warn"
# Guards against leaks, shared-state and float traps, wasted allocations, and
# forms with a plainer spelling (`to_owned`, `?`, `name.rs` over `name/mod.rs`).
mem_forget = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
empty_drop = "warn"
verbose_file_reads = "warn"
str_to_string = "warn"
string_add = "warn"
infinite_loop = "warn"
large_include_file = "warn"
get_unwrap = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
mod_module_files = "warn"
needless_raw_strings = "warn"
unnecessary_self_imports = "warn"
redundant_type_annotations = "warn"
deref_by_slicing = "warn"
# Manifest hygiene: no `*` versions, no `no-`, `with-` or `use-` feature names.
wildcard_dependencies = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
# Crate-wide allowances, each a deliberate style choice rather than a bug class.
# Test-only ergonomics (unnecessary_wraps, needless_pass_by_value, ...) are
# allowed in test scope only: src/lib.rs and the integration-test files that need them.
# Module paths already namespace items; `panel::PanelState` reads better than `panel::State`.
module_name_repetitions = "allow"
# `#[must_use]` on every pure getter is noise; it is added where ignoring a result is a bug.
must_use_candidate = "allow"
# Errors are typed (`io::Error`, domain enums); an `# Errors` section per fn would repeat the type.
missing_errors_doc = "allow"
# const fn is an API promise, not a default.
missing_const_for_fn = "allow"
# Nursery style lint that fights `match` / `if let` readability.
option_if_let_else = "allow"

# System calls std does not wrap. rustix covers the ones with a safe API
# (uids, access checks, statvfs, process groups, signals, renice, pidfds, and
# through `param` the page size and clock rate) and is what src/platform
# uses; libc remains for poll(2), the passwd/group lookups and errno values.
# Both are already in the tree through crossterm, so neither costs a crate;
# `param` is a feature without dependencies, so Cargo.lock does not change.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
rustix = { version = "1.1.5", features = ["fs", "param", "process"] }
# Catches Ctrl+C / Ctrl+\ while a program owns the terminal, so the signal
# stops that program and not FFM. crossterm still pulls signal-hook 0.3; both
# versions install their handlers through the one signal-hook-registry 1.x.
signal-hook = "0.4.4"

# The same crate, for `tests/pty_session_test.rs`: a real pseudo-terminal to
# run the binary on, without an `unsafe` block in the test.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["process", "pty", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
    # The PATH editor reads and writes the registry's Path values, then tells
    # running programs with WM_SETTINGCHANGE.
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    # "Retry as administrator": ShellExecuteEx's "runas" verb asks UAC.
    "Win32_UI_Shell",
    # ...and a named pipe to that administrator for the rest of the session.
    "Win32_System_Pipes",
    "Win32_System_IO",
] }
