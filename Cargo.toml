# Purpose: Defines the main FunnyFileManager crate, features, dependencies, and targets.
[package]
name = "funny-file-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Terminal dual-panel file manager inspired by Far Manager, with AWS S3 integration"
license = "MIT"
repository = "https://github.com/stden/FunnyFileManager"
keywords = ["file-manager", "tui", "terminal", "far-manager", "s3"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "funny_file_manager"
path = "src/lib.rs"

[[bin]]
name = "ffm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tempfile = "3.27"
# Terminal *cell* widths. ratatui budgets each buffer row in cells, so the UI
# must measure the same way: a CJK glyph is one char but two columns.
unicode-width = "0.2"

# AWS S3 integration (optional — enable with --features s3)
aws-config = { version = "1.10", optional = true }
# default-features = false drops the SDK's legacy `rustls` feature, which pins
# rustls 0.21 / rustls-webpki 0.101 (RUSTSEC-2026-0098/0099/0104). The modern
# TLS path (`default-https-client` -> rustls 0.23 + aws-lc, webpki 0.103) is
# what actually serves requests; the remaining features mirror the defaults.
aws-sdk-s3 = { version = "1.140", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
], optional = true }
aws-credential-types = { version = "1.3", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# KeePass .kdbx read/edit (optional — enable with --features keepass).
# default-features = false drops CLI extras; save_kdbx4 unlocks Database::save.
# NOTE: keepass >= 0.13 declares rust-version 1.85, below the crate's 1.95 floor.
# The write path is upstream-experimental, so the module backs up + writes
# atomically (see src/keepass.rs).
keepass = { version = "0.13", default-features = false, features = ["save_kdbx4"], optional = true }
# Serialization for the kdbx -> JSON/YAML export (part of the `keepass` feature).
# serde_norway is a maintained serde_yaml fork; serde_yaml itself is archived.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_norway = { version = "0.9", optional = true }

[dev-dependencies]
criterion = "0.8"
cucumber = "0.23"
futures = "0.3"
# S3 test mocks (used only by `#[cfg(feature = "s3")]` tests in src/s3/tests*.rs).
# Versions track the aws-sdk-s3 1.x smithy stack already in the lockfile.
aws-smithy-http-client = { version = "1.2", features = ["test-util"] }
aws-smithy-types = "1.6"
http_1x = { package = "http", version = "1" }

[features]
test-helpers = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types", "dep:tokio"]
keepass = ["dep:keepass", "dep:serde", "dep:serde_json", "dep:serde_norway"]

[[test]]
name = "editor_test"
path = "tests/editor_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "handlers_test"
path = "tests/handlers_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "navigation_features_test"
path = "tests/navigation_features_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "coverage_100_test"
path = "tests/coverage_100_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "far_manager_hotkeys_test"
path = "tests/far_manager_hotkeys_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "comprehensive_test"
path = "tests/comprehensive_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "extra_coverage_test"
path = "tests/extra_coverage_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "targeted_coverage_tests"
path = "tests/targeted_coverage_tests.rs"
required-features = ["test-helpers"]

[[test]]
name = "coverage_gaps_test"
path = "tests/coverage_gaps_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
required-features = ["test-helpers", "s3"]

[[test]]
name = "coverage_boost_test"
path = "tests/coverage_boost_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "bdd_ru"
path = "tests/bdd_ru.rs"
harness = false
required-features = ["test-helpers", "s3"]

[[test]]
name = "mutation_killer_tests"
path = "tests/mutation_killer_tests.rs"
required-features = ["test-helpers"]

[[bench]]
name = "utils_bench"
harness = false

# ── Dev / test: fastest compile ──────────────────────────────────
# Project code builds with opt-level=0; dependencies get opt-level=2 once
# and are cached by sccache, so test/run loops stay fast.

[profile.dev]
opt-level = 0
# debug = 1 keeps file:line in backtraces without full DWARF (~98% smaller
# target directory). strip = "debuginfo" drops the remaining debug sections.
debug = 1
strip = "debuginfo"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256

[profile.test.package."*"]
opt-level = 2

# ── Release: maximum runtime speed ───────────────────────────────
# Fat LTO + single codegen unit give the compiler full cross-crate
# inlining at the cost of a longer link step. panic=abort removes
# unwinding machinery; strip=symbols shrinks the binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false
overflow-checks = false

# Inherits everything from release but links faster — use for iterating
# on release-only behavior without paying full LTO cost every build.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)", "cfg(coverage)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common patterns used throughout the codebase
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
similar_names = "allow"
option_if_let_else = "allow"
items_after_test_module = "allow"
# Test / cucumber ergonomics under `--all-targets` (pedantic noise, not bugs):
# - Result-returning test helpers and trait stubs that always Ok for the trait
# - cucumber step args taken by value / &mut World when the framework dictates the signature
# - test helpers that could be const but are clearer as plain fns
# - `_` match arms on single-variant enums kept open for future variants
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
needless_pass_by_ref_mut = "allow"
missing_const_for_fn = "allow"
match_wildcard_for_single_variants = "allow"
