[package]
name = "funny-file-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "funny_file_manager"
path = "src/lib.rs"

[[bin]]
name = "ffm"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"

[dev-dependencies]
tempfile = "3.8"

[features]
test-helpers = []

[[test]]
name = "editor_test"
path = "tests/editor_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "handlers_test"
path = "tests/handlers_test.rs"
required-features = ["test-helpers"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)", "cfg(coverage)"] }
