[package]
name = "funny-file-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "funny_file_manager"
path = "src/lib.rs"

[[bin]]
name = "ffm"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"

# AWS S3 integration
aws-config = "1.1"
aws-sdk-s3 = "1.15"
aws-credential-types = "1.1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.8"
aws-smithy-http-client = { version = "1.1", features = ["test-util"] }
aws-smithy-types = "1.4"
http-1x = { package = "http", version = "1" }

[features]
test-helpers = []

[[test]]
name = "editor_test"
path = "tests/editor_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "handlers_test"
path = "tests/handlers_test.rs"
required-features = ["test-helpers"]

[[test]]
name = "navigation_features_test"
path = "tests/navigation_features_test.rs"
required-features = ["test-helpers"]


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)", "cfg(coverage)"] }
