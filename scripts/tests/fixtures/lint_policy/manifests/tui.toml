# Compliant [lints] tables for the tui crate; scripts/test_lint_policy.py mutates them.
[lints.rust]
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)", "cfg(coverage)"] }
# Unsafe is opt-in per item (`#[allow(unsafe_code)]`) in reviewed files only.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
# Reliability lints.
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
redundant_lifetimes = "warn"
explicit_outlives_requirements = "warn"
unused_macro_rules = "warn"
meta_variable_misuse = "warn"
unused_import_braces = "warn"
unused_extern_crates = "warn"
macro_use_extern_crate = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
keyword_idents_2024 = "warn"
non_ascii_idents = "warn"
unsafe_attr_outside_unsafe = "warn"
let_underscore_drop = "warn"
trivial_casts = "warn"
unnameable_types = "warn"
unused_qualifications = "warn"
redundant_imports = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
excessive_nesting = "warn"
too_many_lines = "warn"
# Reliability lints.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
indexing_slicing = "warn"
string_slice = "warn"
as_conversions = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
use_debug = "warn"
iter_over_hash_type = "warn"
filetype_is_file = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
allow_attributes_without_reason = "warn"
mem_forget = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
empty_drop = "warn"
verbose_file_reads = "warn"
str_to_string = "warn"
string_add = "warn"
infinite_loop = "warn"
large_include_file = "warn"
get_unwrap = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
mod_module_files = "warn"
needless_raw_strings = "warn"
unnecessary_self_imports = "warn"
redundant_type_annotations = "warn"
deref_by_slicing = "warn"
wildcard_dependencies = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
undocumented_unsafe_blocks = "deny"
# Names repeat their module on purpose (panel::PanelState reads better at call sites).
module_name_repetitions = "allow"
# Every pure getter would need #[must_use]; noise without catching bugs.
must_use_candidate = "allow"
# Error cases are documented on the error types, not on every fallible fn.
missing_errors_doc = "allow"
# const fn is an API promise, not a default.
missing_const_for_fn = "allow"
# Nursery style lint that fights `match`/`if let` readability.
option_if_let_else = "allow"
