# Purpose: Runs the GitHub Actions quality gate for the Rust workspace.
#
# Every action is pinned by commit SHA, with its release in a comment, since a
# tag can be moved; .github/dependabot.yml proposes the updates.
#
# Runner images are named by version (ubuntu-24.04, windows-2025), never
# -latest: a new image arrives as an edit here that CI tests, not as a silent
# migration. Every job has a timeout, so a hung step fails in minutes instead
# of holding a runner for the 6-hour default.
#
# Nothing else floats either: the compiler is the release rust-toolchain.toml
# names (installed by `rustup toolchain install`, which reads that file), the
# tools come at the versions in `env` below, Colorer at fixed commits, and
# every job that builds the application uses the one Cargo.lock the lockfile
# job resolved for this run. Bump any of them on purpose, in its own commit.
name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  # The application's lockfile is resolved afresh in every run, so a crate
  # release can turn main red without a push. A weekly run shows it within
  # a week; a manual one shows it now.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# A pull request keeps only its newest run. Every other run (a push to main)
# gets a group of its own and always finishes: a cancelled run shows a red job
# as grey, and the breakage is then blamed on a later commit. Sharing the
# group without cancel-in-progress would not do: a third push still cancels
# the run that waits behind the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repository. Caches and artifacts use the runner's own
# token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Tiny registry index + no debuginfo in CI binaries.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTFLAGS: "-C debuginfo=0"
  # cargo-llvm-cov concatenates build.rustc-wrapper
  # with rustc: the empty wrapper in .cargo/config.toml becomes ` rustc` and
  # ENOENT. env(1) is a no-op wrapper. The Windows jobs set it back to "".
  CARGO_BUILD_RUSTC_WRAPPER: /usr/bin/env
  # The tools CI installs, at exact versions: a new typos dictionary or
  # cargo-deny release can fail a run with no code change.
  TOOL_TYPOS: typos@1.50.2
  TOOL_CARGO_DENY: cargo-deny@0.20.2
  TOOL_LLVM_COV: cargo-llvm-cov@0.9.1
  TOOL_NEXTEST: cargo-nextest@0.9.146
  TOOL_MUTANTS: cargo-mutants@27.1.0

jobs:
  # ── One Cargo.lock for the whole run ────────────────────────
  # The application's and colorer-sys's lockfiles are not tracked: a first
  # build resolves them. This job resolves them once and hands the same files
  # to every job that builds, so all jobs test one dependency set and the
  # rust-cache keys follow it. To reproduce a red run, download its
  # `cargo-lock` artifact into a checkout of the same commit. mcp/Cargo.lock
  # is tracked and needs none of this.
  lockfile:
    name: Resolve Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - name: Resolve the application's and colorer-sys's dependencies
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path colorer-sys/Cargo.toml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: |
            Cargo.lock
            colorer-sys/Cargo.lock
          if-no-files-found: error

  # ── Fast static lint gate (coverage runs in parallel in Tests & Coverage) ──
  lint:
    name: Lint (format, readability, clippy, architecture)
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock

      - name: Install mold (fast linker)
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - name: Install Python self-test dependencies
        run: |
          python3 -m venv "${{ runner.temp }}/ffm-coverage-python"
          "${{ runner.temp }}/ffm-coverage-python/bin/python" -m pip install -r requirements-coverage.txt
          echo "PYTHON=${{ runner.temp }}/ffm-coverage-python/bin/python" >> "$GITHUB_ENV"
          echo "${{ runner.temp }}/ffm-coverage-python/bin" >> "$GITHUB_PATH"

      # mcp and colorer-sys build into the shared target/ (.cargo/config.toml).
      # Listing each with a target dir it never writes keys the cache on its
      # Cargo.lock and keeps its crates in the registry without running a
      # second cleanup pass over the root target/.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          workspaces: |
            . -> target
            mcp -> target
            colorer-sys -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The spell check in ./ffm.py lint; typos.toml holds the project words.
      - name: Install typos
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: ${{ env.TOOL_TYPOS }}

      # Run every non-coverage check from scripts/lint.py (`clippy` ends with
      # `architecture`); the 100% Rust/Python coverage gate runs in parallel
      # in the dedicated `coverage` job rather than compiling twice.
      - name: Static lint, Clippy matrix, and architecture contracts
        run: |
          "$PYTHON" ffm.py lint fmt
          "$PYTHON" ffm.py lint spelling
          "$PYTHON" ffm.py lint markdown
          "$PYTHON" ffm.py lint complexity
          "$PYTHON" ffm.py lint duplication
          "$PYTHON" ffm.py lint clippy

      # Spelling probes, script unit tests (scripts/tests), readability
      # fixtures, then the manifest lint policy (scripts/test_lint_policy.py).
      - name: Lint gate self-tests (spelling, script tests, readability, lint policy)
        run: '"$PYTHON" ffm.py lint self-test'

      # ── New checks ──────────────────────────────────────────────────────
      # Fast, self-contained checks that need the same Rust toolchain and
      # Python venv already installed above.

      - name: No accidentally committed scratch or generated files
        run: |
          BAD=$(git ls-files -- '.scratch/**' '**/*.pyc' '**/__pycache__' 2>/dev/null)
          if [ -n "$BAD" ]; then
            echo "::error::scratch or generated files are tracked by git:"
            echo "$BAD"
            exit 1
          fi

      - name: Python type checking (mypy)
        run: |
          "$PYTHON" -m pip install --quiet mypy 2>&1 | tail -1
          "$PYTHON" -m mypy scripts/ \
            src/windows/performance.py src/windows/system_messages.py \
            src/ops/packages/elevated_upgrade.py \
            --ignore-missing-imports --no-strict-optional 2>&1 || true

      - name: Rustdoc — no broken intra-doc links or missing re-exports
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps 2>&1

      - name: MSRV consistency — rust-version matches rust-toolchain.toml
        run: |
          MSRV=$(grep '^rust-version' Cargo.toml | grep -oP '"\K[^"]+')
          CHAN=$(grep '^channel' rust-toolchain.toml | grep -oP '"\K[^"]+')
          echo "Cargo.toml rust-version: $MSRV"
          echo "rust-toolchain.toml channel:  $CHAN"
          [ "$MSRV" = "$CHAN" ] || \
            { echo "::error::rust-version ($MSRV) != toolchain channel ($CHAN)"; exit 1; }

  # ── Complete production coverage: all Rust crates + Python ──
  # The common command uses Cargo's custom test harnesses as well as unit
  # and integration tests; S3 and fallback builds are included.
  coverage:
    name: Tests & Coverage
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Cache instrumented third-party dependencies in a dedicated llvm-cov target.
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov
      # Every TUI BDD scenario writes its frames here; uploaded below.
      FFM_TUI_ARTIFACT_DIR: target/tui-bdd
      # Exercise the real SFTP adapter against a private loopback sshd.
      FFM_TEST_SFTP_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock

      - name: Install mold (fast linker)
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install Rust (rust-toolchain.toml) and llvm-tools
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools

      - name: Install and check the local SFTP test server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          test -x /usr/sbin/sshd || { echo '::error::OpenSSH server is required for the SFTP integration test'; exit 1; }
          command -v ssh-keygen >/dev/null || { echo '::error::ssh-keygen is required for the SFTP integration test'; exit 1; }
          if [ ! -d /run/sshd ]; then
            sudo install -d -m 0755 /run/sshd
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          workspaces: |
            . -> target/llvm-cov
            mcp -> target
            colorer-sys -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install coverage + test tools (prebuilt)
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: ${{ env.TOOL_LLVM_COV }},${{ env.TOOL_NEXTEST }}

      - name: Install Python coverage
        run: |
          python3 -m venv "${{ runner.temp }}/ffm-coverage-python"
          "${{ runner.temp }}/ffm-coverage-python/bin/python" -m pip install -r requirements-coverage.txt
          echo "PYTHON=${{ runner.temp }}/ffm-coverage-python/bin/python" >> "$GITHUB_ENV"
          echo "${{ runner.temp }}/ffm-coverage-python/bin" >> "$GITHUB_PATH"

      - name: Start PostgreSQL for the driver tests
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD '$password';"
          echo "FFM_TEST_POSTGRES_URL=postgres://postgres:$password@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"

      - name: All production Rust and Python lines must be covered
        env:
          FFM_UI_ARTIFACT_DIR: ${{ runner.temp }}/ffm-ui-quality
        run: '"$PYTHON" ffm.py coverage'

      - name: Upload complete coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-coverage
          path: |
            target/coverage-full/rust/rust-*.json
            target/coverage-full/rust/rust-*.lcov
            target/coverage-full/python/python.json
          if-no-files-found: warn

      # KeePass and the libtest-wrapped TUI Cucumber suite (tests/tui_bdd.rs)
      # participate in the default coverage run: this is where the TUI
      # scenarios run on Linux. Fixture vaults use a cheap KDF and a fake
      # clipboard.
      - name: Upload terminal screen transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-screens-Linux
          path: target/tui-bdd/
          if-no-files-found: warn

      - name: Upload terminal visual review SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quality-Linux
          path: ${{ runner.temp }}/ffm-ui-quality/
          if-no-files-found: warn

  # ── BDD tests (need the s3 feature to compile) ──────────────
  # Dedicated cross-platform feedback for S3 and both custom BDD harnesses;
  # the common Rust coverage collector also runs these with all features.
  bdd:
    name: BDD (s3 feature, ${{ matrix.os }})
    needs: lockfile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock

      - name: Install mold (fast linker)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bdd
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Exercise the feature-gated S3 unit suite on both operating systems.
      - name: S3 unit tests (feature-gated)
        run: 'cargo test --features test-helpers,s3 --lib s3::'

      # BDD suites use cucumber-rs with harness = false; nextest only
      # supports libtest harnesses, so run them via cargo test.
      - name: Run BDD tests
        run: cargo test --features test-helpers,s3 --test bdd --test bdd_ru

  # ── Windows: 100% Rust coverage and TUI BDD ─────────────────
  # Linux cannot measure cfg(windows) code. Run the Rust coverage gate on
  # Windows across all three crates (including TUI BDD); Clippy runs in parallel
  # in `windows-clippy` so uninstrumented and llvm-cov caches stay disjoint.
  windows:
    name: Windows (100% Rust coverage, TUI BDD)
    needs: lockfile
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # The coverage collector supplies its Windows compiler pass-through.
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov
      FFM_COVERAGE_SUITES: "root-all,mcp-all,colorer-sys-all"
      FFM_TUI_ARTIFACT_DIR: target/tui-bdd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          workspaces: |
            . -> target/llvm-cov
            mcp -> target
            colorer-sys -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install LLVM coverage
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: ${{ env.TOOL_LLVM_COV }}
      - name: Install LLVM tools
        run: rustup component add llvm-tools
      - name: Start PostgreSQL for the driver tests
        shell: pwsh
        run: |
          # The windows-2025 image ships PostgreSQL 17 as a stopped service with a known superuser password.
          $password = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          $bin = 'C:\Program Files\PostgreSQL\17\bin'
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            & "$bin\pg_isready.exe" -h 127.0.0.1 -q
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          $env:PGPASSWORD = 'root'
          & "$bin\psql.exe" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD '$password';"
          if ($LASTEXITCODE -ne 0) { throw 'could not set the test password' }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "FFM_TEST_POSTGRES_URL=postgres://postgres:$password@127.0.0.1:5432/postgres`n")

      - name: Require 100% coverage of compiled Windows Rust code
        env:
          FFM_UI_ARTIFACT_DIR: ${{ runner.temp }}/ffm-ui-quality
        run: python scripts/coverage.py --rust
      - name: Upload Windows production coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-coverage-Windows
          path: |
            target/coverage-full/rust/rust-*.json
            target/coverage-full/rust/rust-*.lcov
          if-no-files-found: warn
      - name: Upload terminal screen transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-screens-Windows
          path: target/tui-bdd/
          if-no-files-found: warn
      - name: Upload terminal visual review SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-quality-Windows
          path: ${{ runner.temp }}/ffm-ui-quality/
          if-no-files-found: warn

  # ── Windows Clippy (parallel to Windows coverage) ───────────
  # Exercises cfg(windows) code in both the root crate and the MCP server
  # (`list_drives`) without blocking or sharing target/ with llvm-cov.
  windows-clippy:
    name: Windows Clippy (root + MCP)
    needs: lockfile
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-clippy
          workspaces: |
            . -> target
            mcp -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint Windows code and tests
        run: cargo clippy --all-targets --features test-helpers -- -D warnings
      - name: Lint the MCP server's Windows code
        if: ${{ !cancelled() }}
        working-directory: mcp
        run: cargo clippy --all-targets -- -D warnings

  # ── MCP -> FFM application sessions across the process boundary ──
  application-sessions:
    name: MCP application sessions (${{ matrix.os }})
    needs: lockfile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            binary: ffm
          - os: windows-2025
            binary: ffm.exe
    env:
      CARGO_BUILD_RUSTC_WRAPPER: ""
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
      FFM_APPLICATION_TEST_BINARY: ${{ github.workspace }}/target/debug/${{ matrix.binary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock
      - name: Install mold (fast linker)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: application-sessions
          workspaces: |
            . -> target
            mcp -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build both sides of the application protocol
        run: |
          cargo build --locked --bin ffm
          cargo build --locked --manifest-path mcp/Cargo.toml --bin ffm-mcp
      - name: Run real MCP application-session workflows
        run: cargo test --locked --manifest-path mcp/Cargo.toml --test application_sessions -- --ignored

  # ── MCP tests (coverage is enforced by the common gate) ─────
  # Its fmt check and Clippy (all targets, -D warnings) run in the lint job,
  # through scripts/lint.py. It uses its tracked mcp/Cargo.lock, so it does
  # not wait for the lockfile job.
  mcp:
    name: MCP Server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mold (fast linker)
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mcp
          workspaces: "mcp -> ../target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Custom Cucumber harnesses run through Cargo, as in the shared
      # 100% collector. There is no separate weaker MCP threshold.
      - name: MCP unit, integration and BDD tests
        run: cargo test --locked --all-features --no-fail-fast

  # ── Colorer (optional C++ engine) ───────────────────────────
  # Without an installed native engine, colorer-sys supplies fallback stubs.
  # This job measures the actual FFI and root adapter with the engine present.
  colorer:
    name: Colorer feature (FFI + real schemes)
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/llvm-cov
      FFM_COVERAGE_SUITES: "colorer-sys-all,root-all"
      FFM_TEST_SFTP_SERVER: "1"
      # The Colorer commits this job builds and tests against: upstream HEAD
      # of 2026-09-13, which CI built until now. Bump them on purpose.
      COLORER_LIBRARY_SHA: b3c4d81bf9057945d10469168d29b95f59271b44
      COLORER_SCHEMES_SHA: ebc9b537fd62e8a070410124940f9dc31dfbe555
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock
      - name: Install mold (fast linker)
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: colorer
          workspaces: |
            . -> target/llvm-cov
            colorer-sys -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: System libraries Colorer needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libxml2-dev zlib1g-dev libminizip-dev openssh-server
          sudo install -d -m 0755 /run/sshd

      - name: Build Colorer-library
        run: |
          git init --quiet /tmp/Colorer-library
          git -C /tmp/Colorer-library fetch --quiet --depth 1 \
            https://github.com/colorer/Colorer-library "$COLORER_LIBRARY_SHA"
          git -C /tmp/Colorer-library checkout --quiet FETCH_HEAD
          cmake -S /tmp/Colorer-library -B /tmp/Colorer-library/_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCOLORER_USE_VCPKG=OFF \
            -DCOLORER_BUILD_TOOLS=OFF \
            -DCOLORER_BUILD_TEST=OFF
          cmake --build /tmp/Colorer-library/_build --parallel

      - name: Fetch the schemes
        run: |
          git init --quiet /tmp/Colorer-schemes
          git -C /tmp/Colorer-schemes fetch --quiet --depth 1 \
            https://github.com/colorer/Colorer-schemes "$COLORER_SCHEMES_SHA"
          git -C /tmp/Colorer-schemes checkout --quiet FETCH_HEAD

      - name: Install native coverage tools
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: ${{ env.TOOL_LLVM_COV }}
      - name: Install native LLVM tools
        run: rustup component add llvm-tools
      - name: Install Python for native coverage fixtures
        run: |
          python3 -m venv "${{ runner.temp }}/ffm-coverage-python"
          "${{ runner.temp }}/ffm-coverage-python/bin/python" -m pip install -r requirements-coverage.txt
          echo "PYTHON=${{ runner.temp }}/ffm-coverage-python/bin/python" >> "$GITHUB_ENV"
          echo "${{ runner.temp }}/ffm-coverage-python/bin" >> "$GITHUB_PATH"
      - name: Start PostgreSQL for the driver tests
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD '$password';"
          echo "FFM_TEST_POSTGRES_URL=postgres://postgres:$password@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"

      - name: Require 100% Rust coverage with native Colorer
        env:
          COLORER_INCLUDE_DIR: /tmp/Colorer-library/src
          COLORER_BUILD_DIR: /tmp/Colorer-library/_build
          COLORER_CATALOG: /tmp/Colorer-schemes/base/catalog.base.xml
        run: |
          cargo clippy --features colorer --all-targets -- -D warnings
          python3 scripts/coverage.py --rust
      - name: Upload native Colorer production coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-coverage-Colorer
          path: |
            target/coverage-full/rust/rust-*.json
            target/coverage-full/rust/rust-*.lcov
          if-no-files-found: warn

  # ── Dependency policy: licences, advisories, bans, sources ──
  # One policy (deny.toml) for all three manifests, each with every feature on
  # so optional dependencies (s3, keepass, colorer) are judged too. Every step
  # runs even when an earlier one fails, so each manifest reports its own
  # result. Each judges the lockfile the rest of the run builds: the lockfile
  # job's for the application and colorer-sys, the tracked one for MCP.
  # --locked fails the step rather than let cargo resolve another.
  deny:
    name: Dependencies (cargo-deny)
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - name: Install cargo-deny (prebuilt)
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: ${{ env.TOOL_CARGO_DENY }}

      - name: cargo deny — application
        run: cargo deny --locked --all-features --manifest-path Cargo.toml --config deny.toml check

      - name: cargo deny — MCP server
        if: ${{ !cancelled() }}
        run: cargo deny --locked --all-features --manifest-path mcp/Cargo.toml --config deny.toml check

      - name: cargo deny — colorer-sys
        if: ${{ !cancelled() }}
        run: cargo deny --locked --all-features --manifest-path colorer-sys/Cargo.toml --config deny.toml check

  # ── macOS: clippy + tests ───────────────────────────────────
  # Linux and Windows are the primary targets; macOS is tested to catch
  # path-separator bugs, symlink differences, and linker incompatibilities
  # before they reach a user machine. The Colorer C++ engine is not built
  # here (no brew install of ICU/libxml2/minizip in this job), so the test
  # run uses the built-in tokeniser fallback.
  macos:
    name: macOS (clippy + tests)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No mold on macOS. The default linker is ld (clang-based), which is
      # fast enough here; the job exercises macOS-specific code paths, not
      # link-time speed.
      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --all-targets --features test-helpers -- -D warnings

      - name: Tests
        run: cargo test --locked --features test-helpers

  # ── Release binary size budget ───────────────────────────────
  # A TUI application grows silently: one large dependency added for a
  # convenience function doubles startup I/O. This job fails when `ffm`
  # exceeds 25 MiB or `ffm-mcp` exceeds 15 MiB, giving both a margin
  # over their current sizes before the CI turns red.
  size:
    name: Release binary size budget
    needs: lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock

      - name: Install mold (fast linker)
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: size
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release binaries
        run: |
          cargo build --release --locked --bin ffm
          cargo build --release --locked --manifest-path mcp/Cargo.toml --bin ffm-mcp

      - name: Enforce size budgets
        run: |
          FFM=$(stat -c%s target/release/ffm)
          MCP=$(stat -c%s target/release/ffm-mcp)
          echo "ffm:     $(numfmt --to=iec-i $FFM)B  ($FFM bytes)"
          echo "ffm-mcp: $(numfmt --to=iec-i $MCP)B  ($MCP bytes)"
          FAIL=0
          [ "$FFM" -le 26214400 ] || { echo "::error::ffm exceeds 25 MiB limit"; FAIL=1; }
          [ "$MCP" -le 15728640 ] || { echo "::error::ffm-mcp exceeds 15 MiB limit"; FAIL=1; }
          exit $FAIL

  # ── Mutation testing of changed lines (PRs, weekly schedule, manual) ────
  # cargo mutants --in-diff mutates only code the diff touched and runs the
  # suite against each mutant. The application uses .cargo/mutants.toml
  # (exclusions, features, nextest, timeout); feature-gated S3 code runs in its
  # own libtest step. MCP has no config and keeps cargo test: its cucumber suite
  # is harness = false, which nextest cannot run. Its diff is taken with
  # --relative, because cargo-mutants run inside mcp/ matches paths like
  # src/paths.rs; an mcp/src/paths.rs diff matches nothing and passes silently.
  #
  # Each shard tests its slice of the mutants, one at a time: two suites on
  # this two-core runner pushed every test run past its timeout, so every
  # mutant "timed out" and nothing was tested. Four shards keep a diff of
  # about 150 mutants (at roughly 80 s each) inside the 60-minute step.
  #
  # scripts/mutants_verdict.py judges each step from the exit status and
  # mutants.out: a surviving (missed) mutant fails, since a changed line can
  # break without any test noticing; a run where every mutant timed out
  # fails, since it tested nothing; any other exit code (baseline failed 4,
  # diff does not match the tree) fails. A timeout among caught mutants
  # passes with a warning: that mutant hung the suite, which the timeout
  # detected. Kill a survivor with a test that observes the behaviour; only a
  # mutant no test can observe by construction (see `is_root`) is excluded
  # in .cargo/mutants.toml, with the reason. mutants.out is uploaded always.
  mutants:
    name: Mutation testing (diff, shard ${{ matrix.shard }})
    if: github.event_name != 'push'
    needs: lockfile
    runs-on: ubuntu-24.04
    # Longer than the others: the mutation steps below have their own bounds
    # after a few minutes of setup.
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        # `--shard k/n` below takes n from this list's length.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch or parent commit must be present to diff against.
          fetch-depth: 0

      - name: Fetch this run's Cargo.lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-lock

      - name: Install mold (fast linker)
        uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # v1

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      # cargo-mutants builds in a copy of the tree, without its target/; the
      # CARGO_TARGET_DIR of each step below puts the build where this cache
      # saves it, one target dir per crate.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants
          workspaces: |
            . -> target
            mcp -> target
          # Every shard builds the same dependencies; one upload is enough.
          save-if: ${{ matrix.shard == 0 }}

      - name: Install mutation + test tools (prebuilt)
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: ${{ env.TOOL_MUTANTS }},${{ env.TOOL_NEXTEST }}

      - name: Diff to mutate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            DIFF_RANGE="origin/$BASE_REF...HEAD"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi
          git diff "$DIFF_RANGE" > "$RUNNER_TEMP/pr.diff"
          git -C mcp diff --relative "$DIFF_RANGE" > "$RUNNER_TEMP/pr-mcp.diff"

      - name: Mutants in changed application code
        timeout-minutes: 60
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --jobs 1 --shard "$SHARD" \
            --output "$RUNNER_TEMP/mutants-app" || status=$?
          python3 scripts/mutants_verdict.py "$status" "$RUNNER_TEMP/mutants-app/mutants.out"

      - name: Mutants in changed S3 code
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          if grep -q '^diff --git a/src/s3' "$RUNNER_TEMP/pr.diff"; then
            status=0
            cargo mutants --no-config --copy-vcs true \
              --timeout-multiplier 3.0 --minimum-test-timeout 60 \
              --in-diff "$RUNNER_TEMP/pr.diff" \
              --file "src/s3.rs" --file "src/s3/**/*.rs" \
              --exclude "src/**/tests/*.rs" --exclude "src/**/tests/**/*.rs" \
              --exclude "src/**/tests*.rs" --exclude "src/**/*_tests.rs" \
              --features test-helpers,s3 --cargo-arg --lib \
              --jobs 1 --shard "$SHARD" \
              --output "$RUNNER_TEMP/mutants-s3" -- s3:: || status=$?
            python3 scripts/mutants_verdict.py "$status" "$RUNNER_TEMP/mutants-s3/mutants.out"
          fi

      - name: Mutants in changed MCP code
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        working-directory: mcp
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/mcp/target
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/pr-mcp.diff" --jobs 1 --shard "$SHARD" \
            --output "$RUNNER_TEMP/mutants-mcp" || status=$?
          python3 ../scripts/mutants_verdict.py "$status" "$RUNNER_TEMP/mutants-mcp/mutants.out"

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/mutants-app/mutants.out
            ${{ runner.temp }}/mutants-s3/mutants.out
            ${{ runner.temp }}/mutants-mcp/mutants.out
          if-no-files-found: ignore
