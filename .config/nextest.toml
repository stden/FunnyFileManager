# Purpose: Bounds every test nextest runs, so a hung test fails instead of stalling the run, and leaves out the cucumber binaries nextest cannot list.
#
# CI's coverage gate (`./ffm.py coverage`) and `cargo mutants` run the suite
# with nextest. A test that has run for one `period` is reported as SLOW; after
# `terminate-after` periods nextest kills it and it fails. The slowest test
# takes about a second under coverage in CI, so three minutes means stuck, not
# slow: a deadlocked TUI worker, or a child process that never exits. The job's
# own timeout would otherwise wait for hours.
#
# The cucumber suites `bdd` and `bdd_ru` (built only with the `s3` feature) are
# `harness = false` binaries: they cannot answer nextest's `--list`, so with
# them built `cargo nextest run --features test-helpers,s3` failed before
# running anything. The default filter leaves them out by binary, which skips
# their listing too; `cargo test --test bdd --test bdd_ru` runs them, as CI does.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }
default-filter = "not (binary_id(funny-file-manager::bdd) | binary_id(funny-file-manager::bdd_ru))"
