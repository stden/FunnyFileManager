# Purpose: Configures Cargo defaults used by local builds and test runs.
[build]
# jobs is intentionally unset so cargo uses every logical CPU (32 on this
# machine). Override with `cargo build -j N` or CARGO_BUILD_JOBS for headroom.

# sccache caches compiled crate artifacts across clean builds — measured ~3x
# faster on a warm clean build here (9.4s -> 3.0s). Install: cargo install sccache.
# CI uses Swatinem/rust-cache instead (runners have no sccache), so this is a
# local-dev accelerator. It disables incremental compilation, which is a non-issue
# for this crate (single-file edit relinks in ~0.6s either way).
rustc-wrapper = "sccache"

# NOTE: profile settings (opt-level, lto, codegen-units, etc.) live in
# Cargo.toml — stable cargo ignores [profile.*] tables in this file.

# ── Linux: mold linker ──────────────────────────────────────────
# mold is the fastest linker (2-5x vs GNU ld). The win shows on link-heavy
# builds — `cargo test` links one binary per integration test (~15+ here).
# gcc >= 12 drives it directly, so no clang dependency. Install: `apt install
# mold` (CI already installs it via rui314/setup-mold).
# Caveat: an exported RUSTFLAGS env var REPLACES target.*.rustflags, so this
# applies to plain local builds; add the link-arg to RUSTFLAGS too if you set one.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# ── Windows MSVC target ─────────────────────────────────────────
[target.x86_64-pc-windows-msvc]
# LLD linker: 3-5x faster linking than MSVC link.exe
linker = "lld-link"
rustflags = ["-C", "link-arg=-threads:24"]

# ── macOS: LLD linker (opt-in) ──────────────────────────────────
# Uncomment after `brew install llvm` to swap in LLD (2-4x faster than ld64).
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# For a non-portable but maximally fast release binary tuned to the host
# CPU, build with: RUSTFLAGS="-C target-cpu=native" cargo build --release
